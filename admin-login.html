
<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | LIMITLESS</title><style>
:root{--bg:#0b0c0b;--panel:#151715;--line:#30352f;--text:#f5f5ef;--muted:#a5aaa2;--accent:#d6ff69}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#252d1c,transparent 50%),var(--bg);color:var(--text);font:14px Arial,sans-serif;padding:20px}.card{width:min(430px,100%);padding:30px;border:1px solid var(--line);border-radius:20px;background:#131513}.brand{font-size:24px;font-weight:900;letter-spacing:4px}.eyebrow{margin-top:32px;color:var(--accent);font-size:11px;letter-spacing:3px;font-weight:bold}h1{font-size:32px;letter-spacing:-1px;margin:10px 0}.muted{color:var(--muted);line-height:1.7}form{display:grid;gap:15px;margin-top:25px}label{display:grid;gap:8px;color:var(--muted);font-size:12px}input{padding:14px;background:#0b0c0b;border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit}button{padding:14px;border:0;border-radius:9px;background:var(--accent);font-weight:900;cursor:pointer}.status{color:var(--accent);line-height:1.6}.back{display:inline-block;margin-top:20px;color:var(--muted)}
</style></head><body><main class="card"><a href="/" class="brand">LIMITLESS</a><div class="eyebrow">RESTRICTED ACCESS</div><h1>Admin sign in.</h1><p class="muted">Authorized store administrators only. Your account must have explicit administrator permission in Firestore.</p><form id="adminLoginForm"><label>Email address<input type="email" name="email" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password" minlength="6"></label><button>Sign in securely →</button><div id="loginMessage" class="status" role="status"></div></form><a href="/" class="back">← Back to store</a></main><script type="module" src="/app.js"></script></body></html>
