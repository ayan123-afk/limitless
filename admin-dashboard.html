
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <title>Admin Dashboard | LIMITLESS</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#080d18;color:#f2f6ff;font-family:Arial,sans-serif}
    header{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:20px 5%;background:#0d1625;border-bottom:1px solid #243750;flex-wrap:wrap}
    .brand{color:#68caff;letter-spacing:3px;font-weight:bold}
    button{border:0;border-radius:9px;padding:11px 15px;background:#65c8ff;color:#07111d;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.6}
    .logout{background:#26374d;color:white}
    main{max-width:1100px;margin:auto;padding:30px 20px}
    .muted{color:#9eafc5}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:24px}
    .card{background:#0d1625;border:1px solid #263a54;border-radius:16px;padding:22px;min-width:0}
    h1{margin:8px 0}h2{margin-top:0;font-size:19px}
    label{display:block;margin:14px 0 7px;font-size:14px}
    input,textarea,select{width:100%;padding:12px;background:#080f1b;color:white;border:1px solid #31445e;border-radius:9px;font:inherit}
    textarea{min-height:80px;resize:vertical}
    .full{width:100%;margin-top:16px}
    .message{margin-top:12px;color:#8dd9ff;overflow-wrap:anywhere}
    .item{padding:14px 0;border-bottom:1px solid #26364b;display:flex;justify-content:space-between;gap:12px;align-items:center}
    .item:last-child{border-bottom:0}
    .item strong{overflow-wrap:anywhere}
    .delete{background:#48232d;color:#ffd9df;flex-shrink:0}
    #pageStatus{padding:12px;border-radius:9px;background:#17263a;color:#a8dcff;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">LIMITLESS</div>
      <div class="muted">Store administration</div>
    </div>
    <button id="logoutButton" class="logout">Log out</button>
  </header>

  <main>
    <p id="pageStatus">Checking administrator access...</p>
    <h1>Dashboard</h1>
    <p class="muted">Manage your store products from one place.</p>

    <div class="grid">
      <section class="card">
        <h2>Add Product</h2>
        <form id="productForm">
          <label for="productName">Product name</label>
          <input id="productName" required maxlength="100">

          <label for="productPrice">Price (PKR)</label>
          <input id="productPrice" type="number" min="1" step="1" required>

          <label for="productImage">Image URL (optional)</label>
          <input id="productImage" type="url" placeholder="https://...">

          <label for="productCategory">Category</label>
          <input id="productCategory" maxlength="60" placeholder="Men's clothing">

          <label for="productDescription">Description</label>
          <textarea id="productDescription" maxlength="1000"></textarea>

          <button class="full" id="addProductButton" type="submit">Add Product</button>
          <div class="message" id="productMessage" role="status"></div>
        </form>
      </section>

      <section class="card">
        <h2>Store Products</h2>
        <p class="muted">Products currently saved in Firestore.</p>
        <div id="productList">Loading products...</div>
        <button id="refreshButton" class="full">Refresh products</button>
      </section>
    </div>
  </main>

  <script type="module" src="/admin-dashboard.js"></script>
</body>
</html>
