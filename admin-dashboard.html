
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <title>Dashboard | LIMITLESS</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#080d18;color:#f2f6ff;font-family:Arial,sans-serif}
    header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 5%;background:#0d1625;border-bottom:1px solid #263a54}
    .brand{color:#65c8ff;letter-spacing:3px;font-weight:bold}
    main{max-width:1100px;margin:auto;padding:28px 20px}
    .muted{color:#9eafc5;line-height:1.5}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px;margin-top:24px}
    .card{background:#0d1625;border:1px solid #263a54;border-radius:16px;padding:22px;min-width:0}
    h1{margin-bottom:8px}h2{font-size:19px;margin-top:0}
    label{display:block;margin:14px 0 7px;font-size:14px}
    input,textarea{width:100%;padding:12px;background:#080f1b;color:white;border:1px solid #31445e;border-radius:9px;font:inherit}
    textarea{min-height:90px;resize:vertical}
    button{border:0;border-radius:9px;padding:12px 15px;background:#65c8ff;color:#07111d;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.6}
    .logout,.delete{background:#38232c;color:#ffd9df}
    .full{width:100%;margin-top:16px}
    #pageStatus,#productMessage{padding:12px;margin-top:12px;border-radius:9px;background:#17263a;color:#b6e3ff;overflow-wrap:anywhere;line-height:1.5}
    .item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #26364b}
    .item:last-child{border-bottom:0}
    .item strong{overflow-wrap:anywhere}
    .item small{display:block;color:#9eafc5;margin-top:5px}
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">LIMITLESS</div>
      <div class="muted">Store administration</div>
    </div>
    <button id="logoutButton" class="logout">Log out</button>
  </header>

  <main>
    <div id="pageStatus" role="status">Verifying admin access...</div>
    <h1>Dashboard</h1>
    <p class="muted">Manage your store products.</p>

    <div class="grid">
      <section class="card">
        <h2>Add product</h2>
        <form id="productForm">
          <label for="productName">Product name</label>
          <input id="productName" maxlength="100" required>

          <label for="productPrice">Price (PKR)</label>
          <input id="productPrice" type="number" min="1" step="1" required>

          <label for="productImage">Image URL (optional)</label>
          <input id="productImage" type="url" placeholder="https://...">

          <label for="productCategory">Category</label>
          <input id="productCategory" maxlength="60" placeholder="Men's clothing">

          <label for="productDescription">Description</label>
          <textarea id="productDescription" maxlength="1000"></textarea>

          <button id="addProductButton" class="full" type="submit">Save product</button>
          <div id="productMessage" role="status"></div>
        </form>
      </section>

      <section class="card">
        <h2>Products</h2>
        <p class="muted">Products stored in Firestore.</p>
        <div id="productList">Waiting for admin verification...</div>
        <button id="refreshButton" class="full" type="button">Refresh</button>
      </section>
    </div>
  </main>

  <script type="module" src="/admin-dashboard.js"></script>
</body>
</html>
